// Сборка мода «Пуповина» под Minecraft 1.16.5 / Forge 36.2.42.
//
// Почему именно ForgeGradle 5, а не 6, который лежит в свежем MDK: шестая
// версия требует Java 17 для самого Gradle, а в системе есть только 8, 11 и 24.
// Пятая — родная для 1.16.5, работает на Gradle 7 и JDK 8.
//
// Имена классов берём МОДЖАНГОВСКИЕ (mappings channel 'official'). Это важно
// не сейчас, а потом: старые имена MCP заброшены после 1.16.5, а моджанговские
// живут и в 1.20, и дальше. Код, написанный на них, переносится на новую версию
// почти без правок.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = mod_version
group = mod_group_id
archivesBaseName = mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            // Заходим на нашу бойню сразу, минуя меню: проверку должно быть можно
            // запускать без единого щелчка мышью, иначе она не воспроизводима.
            args '--username', 'Boec', '--server', '127.0.0.1', '--port', '25565'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    def svojstva = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties svojstva
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand svojstva
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// reobfJar переводит наши моджанговские имена обратно в обфусцированные —
// без этого шага собранный jar не заработает в настоящей игре.
jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
